[project]
name = "review-denoiser-backend"
version = "0.1.0"
description = "Google Maps review analysis API"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110,<1", "anyio>=4.1,<5", "uvicorn[standard]>=0.31,<1", "pydantic>=2,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]
gemini = ["google-genai>=3.6.1,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
